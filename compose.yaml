name: agentquilt

x-app: &app
  image: agentquilt:dev
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    DATABASE_URL: postgresql+psycopg://agentquilt:agentquilt@db:5432/agentquilt
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: agentquilt
      POSTGRES_PASSWORD: agentquilt
      POSTGRES_DB: agentquilt
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentquilt -d agentquilt"]
      interval: 5s
      timeout: 3s
      retries: 10

  serve:
    <<: *app
    command: ["serve"]

  work:
    <<: *app
    command: ["work"]

  tick:
    <<: *app
    command: ["tick"]

volumes:
  db-data:
