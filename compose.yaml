name: agentquilt

x-app: &app
  image: agentquilt:dev
  environment:
    DATABASE_URL: postgresql+psycopg://agentquilt:agentquilt@db:5432/agentquilt
    # The seeded tier binding is an OpenRouter model; without this the `work`
    # role reaches the provider with no key and every step fails there.
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: agentquilt
      POSTGRES_PASSWORD: agentquilt
      POSTGRES_DB: agentquilt
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentquilt -d agentquilt"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The schema before any role reads it: a one-shot the three roles wait on, so
  # a first `compose up` on an empty volume comes up migrated. One image, four
  # roles (ADR-0011), so the service that runs first builds it and the rest name
  # it: four builds of the same tag race each other on export.
  migrate:
    image: agentquilt:dev
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://agentquilt:agentquilt@db:5432/agentquilt
    depends_on:
      db:
        condition: service_healthy
    command: ["migrate"]
    restart: "no"

  serve:
    <<: *app
    command: ["serve"]
    ports:
      - "8000:8000"

  work:
    <<: *app
    command: ["work"]

  tick:
    <<: *app
    command: ["tick"]

volumes:
  db-data:
