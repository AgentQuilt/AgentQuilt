[project]
name = "agentquilt"
version = "0.1.0"
description = "AgentQuilt kernel and modules."
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.19.1",
    "fastapi==0.141.1",
    "psycopg[binary,pool]==3.3.4",
    "pydantic-ai==2.36.0",
    "sqlalchemy[asyncio]==2.0.52",
]

[project.scripts]
agentquilt = "app.main:main"

[dependency-groups]
dev = [
    "anyio==4.14.2",
    "httpx==0.28.1",
    "pyright==1.1.411",
    "pytest==9.1.1",
    "ruff==0.16.5",
    "testcontainers[postgres]==4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff.lint]
select = ["E", "F", "N", "C901", "PLR0913", "BLE001", "S110"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 3

[tool.ruff.lint.pep8-naming]
# The ledger's conflict is named for the glossary word, not for the -Error suffix
# N818 asks for; the vocabulary rule outranks the suffix convention.
ignore-names = ["VersionConflictError"]

[tool.ruff.lint.per-file-ignores]
# Hooks are best-effort by design: a raising hook kills the turn.
"../.claude/hooks/*.py" = ["BLE001", "S110"]

[tool.pyright]
include = ["app", "conftest.py", "migrations", "tests"]
extraPaths = ["migrations"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests", "app"]
pythonpath = ["migrations"]
